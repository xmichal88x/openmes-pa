name: Tests

on:
  push:
    branches:
      - 'pa/**'
  pull_request:
    branches:
      - 'pa/**'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel tests (PHP 8.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify PA modules present
        run: |
          test -d backend/modules/PipelineDashboard
          test -d backend/modules/PlPackagingExtras

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_sqlite, mbstring, zip, gd, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Cache Composer packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Cache npm packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: backend/node_modules
          key: npm-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: npm-

      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install npm dependencies, lint, test and build assets
        working-directory: backend
        run: npm ci && npm run lint && npm test && npm run build

      - name: Copy .env and generate key
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        working-directory: backend
        run: php artisan test

  image-build:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image (no push)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: pa-ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PA modules present in image
        run: docker run --rm --entrypoint sh pa-ci-test -c 'ls /var/www/html/modules | grep -E "PipelineDashboard|PlPackagingExtras"'

      - name: Verify Laravel runtime directories exist
        run: docker run --rm --entrypoint sh pa-ci-test -c 'test -d /var/www/html/storage && test -d /var/www/html/bootstrap/cache'
